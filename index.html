<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Lootly SGD POS — Point of Sale System</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
 --bg:#FFF8F8;--surface:#FFFFFF;--surface2:#FFF0F0;--border:#EDD8D8;
 --text:#1a1a1a;--text2:#994040;--text3:#AB8E8E;
 --accent:#B80000;--accent-bg:#F5D0D0;--accent-text:#7A0000;
 --green:#2E7D32;--green-bg:#E8F5E9;--green-text:#1B5E20;
 --amber:#BA7517;--amber-bg:#FAEEDA;--amber-text:#633806;
 --blue:#185FA5;--blue-bg:#E6F1FB;--blue-text:#0C447C;
 --red:#B80000;--red-bg:#FFEBEE;--red-text:#7A0000;
 --sidebar:220px;--radius:10px;--radius-sm:6px;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);display:flex;height:100vh;overflow:hidden;font-size:14px}
#sidebar{width:var(--sidebar);background:#FAEAEA;color:#B80000;display:flex;flex-direction:column;flex-shrink:0;border-right:1px solid #EAC4C4}
.brand{padding:20px 18px 16px;border-bottom:1px solid #EAC4C4}
.brand-name{font-size:16px;font-weight:600;color:#B80000;letter-spacing:-0.3px}
.brand-sub{font-size:11px;color:#C47A7A;margin-top:2px}
.nav{flex:1;padding:12px 8px;display:flex;flex-direction:column;gap:2px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--radius-sm);cursor:pointer;color:#994040;font-size:13px;font-weight:500;transition:all 0.15s;border:none;background:none;width:100%;text-align:left;font-family:inherit}
.nav-item:hover{color:#B80000;background:#F5D0D0}
.nav-item.active{color:#fff;background:#B80000}
.nav-icon{width:16px;height:16px;flex-shrink:0}
.sidebar-footer{padding:12px 8px;border-top:1px solid #EAC4C4}
.store-info{padding:8px 10px;border-radius:var(--radius-sm);background:#F5D0D0}
.store-name{font-size:12px;font-weight:500;color:#B80000}
.store-date{font-size:11px;color:#C47A7A;margin-top:2px}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:52px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px;flex-shrink:0}
.page-title{font-size:15px;font-weight:600}
.topbar-actions{display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text);transition:all 0.15s;font-family:inherit}
.btn:hover{background:var(--surface2)}
.btn:disabled{opacity:0.45;cursor:not-allowed;pointer-events:none}
.btn-primary{background:#fff;color:#B80000;border-color:#B80000}
.btn-primary:hover{background:#FFF0F0}
.btn-green{background:var(--green);color:#fff;border-color:var(--green)}
.btn-green:hover{background:#1B5E20}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-ghost{border-color:transparent;background:transparent}
.btn-ghost:hover{background:var(--surface2)}
.btn-danger{background:var(--red-bg);color:var(--red-text);border-color:transparent}
.btn-danger:hover{background:#f5c1c1}
.content{flex:1;overflow-y:auto;padding:20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.card-title{font-size:11px;font-weight:500;color:var(--text3);margin-bottom:12px;text-transform:uppercase;letter-spacing:0.5px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px}
.stat-label{font-size:11px;color:var(--text3);font-weight:500;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px}
.stat-value{font-size:22px;font-weight:600;color:var(--text);line-height:1}
.stat-sub{font-size:11px;color:var(--text3);margin-top:4px}
.profit-positive{color:var(--green);font-weight:600}
.profit-negative{color:var(--red);font-weight:600}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:500}
.badge-green{background:var(--green-bg);color:var(--green-text)}
.badge-red{background:var(--red-bg);color:var(--red-text)}
.badge-amber{background:var(--amber-bg);color:var(--amber-text)}
.badge-blue{background:var(--blue-bg);color:var(--blue-text)}
.badge-gray{background:var(--surface2);color:var(--text2)}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:8px 12px;font-size:11px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:0.5px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--border);color:var(--text);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--bg)}

/* POS */
#pos-layout{display:flex;flex:1;overflow:hidden}
#product-panel{flex:1;overflow-y:auto;padding:16px;background:var(--bg)}
#cart-panel{width:320px;background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(126px,1fr));gap:10px}
.product-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px;cursor:pointer;transition:all 0.15s;text-align:center;user-select:none}
.product-card:hover{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-bg)}
.product-card.oos{opacity:0.45;cursor:not-allowed;pointer-events:none}
.p-sku{font-size:10px;color:var(--text3);font-family:'DM Mono',monospace;margin-bottom:4px;letter-spacing:0.3px}.p-brand{font-size:10px;color:var(--text3);margin-bottom:3px}
.p-name{font-size:12px;font-weight:500;color:var(--text);margin-bottom:3px;line-height:1.3}
.p-price{font-size:13px;font-weight:600;color:var(--accent)}
.p-stock{font-size:10px;color:var(--text3)}
.cart-hdr{padding:12px 16px;border-bottom:1px solid var(--border);font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.cart-items{flex:1;overflow-y:auto;padding:8px;min-height:0}
.cart-item{display:flex;align-items:center;gap:8px;padding:8px;border-radius:var(--radius-sm);margin-bottom:3px}
.cart-item:hover{background:var(--bg)}
.qty-ctrl{display:flex;align-items:center;gap:4px}
.qty-btn{width:22px;height:22px;border:1px solid var(--border);border-radius:4px;background:var(--surface);cursor:pointer;font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center;color:var(--text);font-family:inherit}
.qty-btn:hover{background:var(--surface2)}
.qty-num{font-size:12px;font-weight:700;min-width:20px;text-align:center}
.cart-footer{border-top:1px solid var(--border);padding:12px 16px;flex-shrink:0}
.cart-row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;color:var(--text2)}
.cart-total-row{font-size:17px;font-weight:700;color:var(--text);border-top:1px solid var(--border);padding-top:10px;margin-top:6px;margin-bottom:12px;display:flex;justify-content:space-between}
.cart-empty{padding:40px 16px;text-align:center;color:var(--text3);font-size:13px}
.pay-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.pay-btn{padding:8px 4px;border:1.5px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;font-size:12px;font-weight:600;text-align:center;background:var(--surface);color:var(--text2);transition:all 0.15s;font-family:inherit}
.pay-btn:hover{border-color:var(--accent);color:var(--accent)}
.pay-btn.sel{border-color:var(--accent);background:var(--accent-bg);color:var(--accent-text)}

/* Cash panel */
.cash-displays{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.cash-box{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 10px}
.cash-lbl{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:0.4px;font-weight:500;margin-bottom:2px}
.cash-val{font-size:20px;font-weight:700;font-family:'DM Mono',monospace;color:var(--text);line-height:1.2}
.cash-val.pos{color:var(--green)}
.cash-val.neg{color:var(--red)}
.cash-input{width:100%;padding:9px 10px;border:1.5px solid var(--accent);border-radius:var(--radius-sm);font-size:15px;font-family:'DM Mono',monospace;font-weight:600;color:var(--text);background:var(--surface);outline:none;margin-bottom:8px}
.cash-input:focus{box-shadow:0 0 0 3px var(--accent-bg)}
.bill-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:8px}
.bill-btn{padding:7px 0;border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;font-size:12px;font-weight:600;text-align:center;background:var(--surface);color:var(--text2);transition:all 0.15s;font-family:'DM Mono',monospace}
.bill-btn:hover{background:var(--amber-bg);color:var(--amber-text);border-color:var(--amber)}
.bill-exact{background:var(--green-bg);color:var(--green-text);border-color:transparent;grid-column:span 2}
.bill-exact:hover{background:#C0DD97;color:var(--green-text)}

/* Forms */
.form-group{margin-bottom:14px}
.form-label{display:block;font-size:12px;font-weight:500;color:var(--text2);margin-bottom:5px}
.form-input{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;font-family:inherit;color:var(--text);background:var(--surface)}
.form-input:focus{outline:none;border-color:var(--accent)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
select.form-input{cursor:pointer}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.45);display:flex;align-items:center;justify-content:center;z-index:1000}
.modal{background:var(--surface);border-radius:var(--radius);padding:24px;width:520px;max-width:92vw;max-height:88vh;overflow-y:auto}
.modal-title{font-size:16px;font-weight:600;margin-bottom:16px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}

/* Receipt */
.receipt{font-family:'DM Mono',monospace;font-size:12px;background:#fafaf8;padding:20px;border-radius:var(--radius);border:1px solid var(--border)}
.r-title{text-align:center;font-size:14px;font-weight:700;margin-bottom:4px}
.r-sub{text-align:center;color:var(--text2);margin-bottom:14px;font-size:11px}
.r-line{display:flex;justify-content:space-between;margin-bottom:4px}
.r-div{border:none;border-top:1px dashed var(--border);margin:10px 0}
.r-total{font-weight:700;font-size:13px}
.r-change{font-size:15px;font-weight:700;color:var(--green-text)}

/* Search/filter */
.search-bar{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px 10px;margin-bottom:12px}
.search-bar input{flex:1;border:none;outline:none;font-size:13px;font-family:inherit;color:var(--text);background:transparent}
.search-bar input::placeholder{color:var(--text3)}
.cat-filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.cat-btn{padding:4px 12px;border-radius:20px;font-size:12px;font-weight:500;border:1px solid var(--border);background:var(--surface);cursor:pointer;color:var(--text2);transition:all 0.15s;font-family:inherit}
.cat-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.bar-chart{display:flex;align-items:flex-end;gap:6px;height:80px;margin-top:8px}
.bar{flex:1;background:var(--accent-bg);border-radius:3px 3px 0 0;min-width:20px;transition:background 0.15s}
.bar:hover{background:var(--accent)}
.bar-label{font-size:9px;color:var(--text3);text-align:center;margin-top:3px}
.low-alert{background:var(--amber-bg);border:1px solid #FAC775;border-radius:var(--radius-sm);padding:8px 12px;font-size:12px;color:var(--amber-text);margin-bottom:12px}

/* DB */
.tab-bar{display:flex;border-bottom:1px solid var(--border);margin-bottom:16px}
.tab{padding:9px 16px;font-size:13px;font-weight:500;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all 0.15s}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.danger-zone{background:var(--red-bg);border:1px solid #F09595;border-radius:var(--radius-sm);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.dz-text{font-size:13px;color:var(--red-text);font-weight:500}
.dz-sub{font-size:11px;color:var(--red-text);opacity:0.7;margin-top:2px}

::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:10px}
</style>
</head>

<script>
// ════════════════════════════════════════════
// GOOGLE SHEETS DATA LAYER
// Paste your Apps Script Web App URL below
// ════════════════════════════════════════════
let GS_URL = localStorage.getItem('gs_url') || '';
let FX_RATE = parseFloat(localStorage.getItem('fx_rate')) || 47; // SGD → PHP exchange rate

function cp(x){return JSON.parse(JSON.stringify(x));}

// In-memory DB — loaded from Google Sheets on startup
let DB = {products:[], transactions:[], expenses:[], expensesSGD:[], movements:[], priceChanges:[],
  transactionsSGD:[], priceChangesSGD:[],
  brandCodes:[], scaleCodes:[], modelCodes:[], variantCodes:[], makeCodes:[]};

// ── API call helper ──────────────────────────────────────────
// ── API call helper with timeout + automatic retry ───────────
// Apps Script Web Apps can have "cold start" delays after inactivity.
// A single failed/slow attempt shouldn't immediately show an error —
// we retry a couple of times with backoff before giving up.
async function apiRaw(action, body={}, timeoutMs=30000) {
  if(!GS_URL) throw new Error('NO_URL');
  const controller = new AbortController();
  const timer = setTimeout(()=>controller.abort(), timeoutMs);
  try {
    const res = await fetch(GS_URL, {
      method:'POST',
      body: JSON.stringify({action, ...body}),
      signal: controller.signal
    });
    clearTimeout(timer);
    const json = await res.json();
    if(!json.ok) throw new Error(json.error||'API error');
    return json.data;
  } catch(err) {
    clearTimeout(timer);
    if(err.name === 'AbortError') throw new Error('Request timed out — Google Apps Script may be cold-starting');
    throw err;
  }
}

async function api(action, body={}, retries=2) {
  let lastErr;
  for(let attempt=0; attempt<=retries; attempt++){
    try {
      if(attempt>0){
        // Show retry message so user knows we're still trying
        showSyncBanner('loading', `Retrying connection (attempt ${attempt+1} of ${retries+1})…`);
      }
      return await apiRaw(action, body);
    } catch(err) {
      lastErr = err;
      if(err.message === 'NO_URL') throw err; // no point retrying this
      console.warn(`[api] "${action}" attempt ${attempt+1}/${retries+1} failed:`, err.message);
      if(attempt < retries){
        // Exponential-ish backoff: 1s, 2s, 3s...
        const wait=1000*(attempt+1);
        showSyncBanner('loading', `Connection slow — retrying in ${wait/1000}s…`);
        await new Promise(r=>setTimeout(r, wait));
      }
    }
  }
  console.error(`[api] "${action}" failed after ${retries+1} attempts:`, lastErr);
  throw lastErr;
}

// ── Load all data from Sheets on startup ────────────────────
async function loadFromSheets() {
  showSyncBanner('loading');
  try {
    // getAll now also ensures headers exist server-side — single round-trip
    const all = await api('getAll');
    DB.products     = (all.products     || []);
    // SGD POS uses transactionsSGD and expensesSGD as its own stores
    all.transactions = all.transactionsSGD || [];
    all.priceChanges = all.priceChangesSGD || [];
    all.expenses     = all.expensesSGD     || [];
    DB.transactions = (all.transactions || []).map(t=>({...t,
      date: toDateStr(t.date),
      time: normaliseTime(t.time)
    }));
    DB.expenses  = (all.expenses  || []).map(e=>({...e, date:toDateStr(e.date)}));
    DB.movements = (all.movements || []).map(m=>({...m,
      date: toDateStr(m.date),
      time: normaliseTime(m.time)
    }));
    DB.priceChanges = (all.priceChanges || []).map(pc=>({...pc,
      date: toDateStr(pc.date),
      time: normaliseTime(pc.time)
    }));
    DB.brandCodes   = all.brandCodes   || [];
    DB.scaleCodes   = all.scaleCodes   || [];
    DB.modelCodes   = all.modelCodes   || [];
    DB.variantCodes = all.variantCodes || [];
    DB.makeCodes    = all.makeCodes    || [];
    hideSyncBanner();
    return true;
  } catch(e) {
    if(e.message === 'NO_URL') {
      hideSyncBanner();
    } else {
      console.error('[loadFromSheets] failed:', e);
      showSyncBanner('error', e.message);
    }
    return false;
  }
}

// 
// UTILS
// 
const fmt=n=>'S$'+Number(n).toFixed(2);
// Always use LOCAL date/time — never UTC
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const nowTime=()=>new Date().toLocaleTimeString('en-SG',{hour:'2-digit',minute:'2-digit',hour12:false});
const uid=()=>Math.random().toString(36).slice(2,9);
// ── Date / time helpers ─────────────────────────────────────
// Apps Script always returns date as "YYYY-MM-DD" and time as "HH:MM".
// These functions also handle any edge-case raw values defensively.

function toDateStr(s){
 if(s===null||s===undefined||s==='') return '';
 if(typeof s==='number'){
  // OLE serial from Sheets — use UTC math to avoid TZ shift
  // Sheets epoch = Jan 1 1900 = serial 1 (with leap-year bug offset of 2)
  const ms=(s-25569)*86400*1000;
  const d=new Date(ms);
  return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0');
 }
 const str=String(s).trim();
 // Already YYYY-MM-DD
 if(/^\d{4}-\d{2}-\d{2}$/.test(str)) return str;
 // ISO or datetime string — extract date portion only (no TZ shift)
 const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(str);
 if(m) return m[1]+'-'+m[2]+'-'+m[3];
 return str;
}

function normaliseTime(t){
 if(t===null||t===undefined||t==='') return '—';
 if(typeof t==='string'){
  const str=t.trim();
  // Already HH:MM or HH:MM:SS
  if(/^\d{1,2}:\d{2}/.test(str)) return str.slice(0,5);
  // ISO datetime — extract time part
  const iso=/T(\d{2}:\d{2})/.exec(str);
  if(iso) return iso[1];
 }
 if(typeof t==='number'){
  // Fractional day (e.g. 0.604 = 14:29) or full OLE serial
  const frac=t%1;
  const totalSec=Math.round(frac*86400);
  const hh=String(Math.floor(totalSec/3600)).padStart(2,'0');
  const mm=String(Math.floor((totalSec%3600)/60)).padStart(2,'0');
  return hh+':'+mm;
 }
 return '—';
}

function fmtDate(s){
 const ds=toDateStr(s);
 if(!ds) return '—';
 const [y,m,d]=ds.split('-').map(Number);
 if(!y||!m||!d) return '—';
 return new Date(y,m-1,d).toLocaleDateString('en-SG',{day:'2-digit',month:'short',year:'numeric'});
}
function parseDate(s){
 const ds=toDateStr(s);
 if(!ds) return new Date(0);
 const [y,m,d]=ds.split('-').map(Number);
 return new Date(y,m-1,d);
}

function getTopProds(days){
 const cut=new Date();cut.setDate(cut.getDate()-days);
 const m={};
 DB.transactions.filter(t=>parseDate(t.date)>=cut).forEach(t=>{
 (t.items||[]).forEach(i=>{
 const p=DB.products.find(x=>x.id===i.id);if(!p)return;
 if(!m[i.id])m[i.id]={...p,qty:0,revenue:0};
 m[i.id].qty+=i.qty;m[i.id].revenue+=i.price*i.qty;
 });
 });
 return Object.values(m).sort((a,b)=>b.revenue-a.revenue);
}

window.addToCart=function(id){
 const p=DB.products.find(x=>x.id===id);if(!p||p.stock===0)return;
 const ex=cart.find(x=>x.id===id);
 if(ex){if(ex.qty>=p.stock)return;ex.qty++;}
 else cart.push({id:p.id,name:p.name,sku:p.sku||'',brand:p.brand||'',price:p.priceSGD||0,cost:p.costSGD||0,qty:1});
 if(window._drawCart)window._drawCart();
};
window.changeQty=function(id,d){
 const idx=cart.findIndex(x=>x.id===id);if(idx<0)return;
 cart[idx].qty+=d;
 if(cart[idx].qty<=0)cart.splice(idx,1);
 if(window._drawCart)window._drawCart();
};
window.clearCart=function(){cart=[];cashTendered=0;if(window._drawCart)window._drawCart();};

window.doCheckout=function(){
 if(!cart.length)return;
 const sub=cart.reduce((s,i)=>s+i.price*i.qty,0);
 const tax=sub*0;
 const total=sub+tax;
 const isCash=payMethod==='Cash';
 if(isCash&&cashTendered<total)return;
 const change=isCash?Math.round((cashTendered-total)*100)/100:0;
 const tx={
 id:'TX'+uid(),date:today(),
 time:nowTime(),
 items:cart.map(i=>({id:i.id,name:i.name,sku:i.sku||'',price:i.price,cost:i.cost||0,qty:i.qty})),
 subtotal:Math.round(sub*100)/100,
 tax:Math.round(tax*100)/100,
 total:Math.round(total*100)/100,
 payment:payMethod,
 cashTendered:isCash?cashTendered:null,
 change:isCash?change:null
 };
 cart.forEach(i=>{const p=DB.products.find(x=>x.id===i.id);if(p){const before=p.stock;p.stock=Math.max(0,p.stock-i.qty);saveProduct(p);logMovement(p,'Sold',-(-before),-(before-p.stock),'Sale '+tx.id);}});
 DB.transactions.unshift(tx);
 saveTransaction(tx);
 showSyncBanner('saving');
 cart=[];cashTendered=0;
 showReceipt(tx);
};

 document.getElementById('topbar-actions').innerHTML=`<button class="btn btn-primary btn-sm" onclick="addProduct()">+ Add Product</button>`;
 let s='';
 let sortCol='dateAdded'; // default sort column — newest added first
 let sortDir='desc';      // 'asc' or 'desc'

 // Sortable column definitions: key → comparator value getter
 const sortCols={
  sku:      p=>(p.sku||'').toLowerCase(),
  barcode:  p=>(p.barcode||'').toLowerCase(),
  name:     p=>(p.name||'').toLowerCase(),

  margin:   p=>(p.priceSGD||0)>0?((p.priceSGD||0)-(p.costSGD||0))/(p.priceSGD||0):0,
  stock:    p=>p.stock,
  status:   p=>p.stock===0?3:p.stock<=5?2:p.stock<=15?1:0,
  dateAdded:p=>(p.dateAdded||p.createdAt||''),
 };

 // Render static shell once
 c.innerHTML=`<div class="content">
 <div class="grid-3">
 <div class="stat"><div class="stat-label">Products</div><div class="stat-value" id="inv-stat-count"></div></div>
 <div class="stat"><div class="stat-label">Stock Value</div><div class="stat-value" id="inv-stat-val"></div><div class="stat-sub">At cost price</div></div>
 <div class="stat"><div class="stat-label">Low Stock</div><div class="stat-value" id="inv-stat-low"></div><div class="stat-sub">&#8804; 5 units</div></div>
 </div>
 <div class="card">
 <div class="search-bar"><svg width="14" height="14" viewBox="0 0 16 16" fill="none"><circle cx="6.5" cy="6.5" r="5" stroke="var(--text3)" stroke-width="1.5"/><path d="M10.5 10.5l3 3" stroke="var(--text3)" stroke-width="1.5" stroke-linecap="round"/></svg>
 <input id="inv-s" placeholder="Search… use commas for multiple keywords"/></div>
 <div class="table-wrap"><table>
 <thead id="inv-thead"><tr></tr></thead>
 <tbody id="inv-tbody"></tbody>
 </table></div>
 </div>
 </div>`;

 // Wire search input ONCE
 document.getElementById('inv-s').addEventListener('input',e=>{s=e.target.value;drawTable();});

 // Column header config: [label, sortKey or null]
 const cols=[
  ['SKU',        'sku'],
  ['Barcode',    'barcode'],
  ['Product',    'name'],
  ['Brand',      'brand'],
  ['Model',      'model'],
  ['Make',       'make'],
  ['Category',   'category'],
  ['Price (S$)', 'priceSGD'],
  ['Cost (S$)',  'costSGD'],
  ['Margin',     'margin'],
  ['Stock',      'stock'],
  ['Status',     'status'],
  ['Date Added', 'dateAdded'],
  ['Actions',    null],
 ];

 function sortIcon(key){
  if(sortCol!==key) return '<span style="color:var(--border);margin-left:3px;font-size:10px">↕</span>';
  return sortDir==='asc'
   ?'<span style="color:var(--accent);margin-left:3px;font-size:10px">▲</span>'
   :'<span style="color:var(--accent);margin-left:3px;font-size:10px">▼</span>';
 }

 function drawHeaders(){
  document.querySelector('#inv-thead tr').innerHTML=cols.map(([label,key])=>{
   if(!key) return`<th>${label}</th>`;
   const active=sortCol===key;
   return`<th style="cursor:pointer;user-select:none;white-space:nowrap;${active?'color:var(--text);':''}background:transparent;transition:color 0.15s"
    onclick="window._invSort('${key}')"
    onmouseover="this.style.color='var(--text)'"
    onmouseout="this.style.color='${active?'var(--text)':'var(--text3)'}'"
   >${label}${sortIcon(key)}</th>`;
  }).join('');
 }

 function drawTable(){
  // Update stats
  const lowCount=DB.products.filter(p=>p.stock<=5).length;
  document.getElementById('inv-stat-count').textContent=DB.products.length;
  document.getElementById('inv-stat-val').textContent=fmt(DB.products.reduce((x,p)=>x+(p.costSGD||0)*p.stock,0));
  const lowEl=document.getElementById('inv-stat-low');
  lowEl.textContent=lowCount;
  lowEl.className='stat-value '+(lowCount>0?'profit-negative':'profit-positive');
  // Filter
  let prods=[...DB.products];
  if(s){const kws=s.split(',').map(k=>k.trim().toLowerCase()).filter(Boolean);kws.forEach(k=>{prods=prods.filter(p=>String(p.name||'').toLowerCase().includes(k)||String(p.category||'').toLowerCase().includes(k)||String(p.sku||'').toLowerCase().includes(k)||String(p.barcode||'').toLowerCase().includes(k)||String(p.brand||'').toLowerCase().includes(k)||String(p.model||'').toLowerCase().includes(k));});}
  // Sort
  const getter=sortCols[sortCol];
  if(getter){
   prods.sort((a,b)=>{
    const av=getter(a), bv=getter(b);
    if(av<bv) return sortDir==='asc'?-1:1;
    if(av>bv) return sortDir==='asc'?1:-1;
    return 0;
   });
  }
  // Render headers (updates sort icons)
  drawHeaders();
  // Render tbody
  document.getElementById('inv-tbody').innerHTML=prods.map(p=>{
   const mg=(p.priceSGD||0)>0?(((p.priceSGD||0)-(p.costSGD||0))/(p.priceSGD||0)*100).toFixed(0):'0';
   const sc=p.stock===0?'badge-red':p.stock<=5?'badge-amber':p.stock<=15?'badge-blue':'badge-green';
   const st=p.stock===0?'Out of stock':p.stock<=5?'Low stock':p.stock<=15?'Limited':'In stock';

   return`<tr>
   <td style="font-family:'DM Mono',monospace;font-size:11px;color:var(--text3);white-space:nowrap">${p.sku||'&#x2014;'}</td>
   <td style="font-family:'DM Mono',monospace;font-size:11px;color:var(--text3);white-space:nowrap">${p.barcode||'&#x2014;'}</td>

   <td><span class="badge badge-gray">${p.category}</span></td>

   <td style="color:var(--text2)">${p.costSGD?'S$'+Number(p.costSGD).toFixed(2):'&#x2014;'}</td>
   <td style="color:var(--green);font-weight:500">${mg}%</td>
   <td style="font-weight:700">${p.stock}</td>
   <td><span class="badge ${sc}">${st}</span></td>
   <td style="color:var(--text2);font-size:12px">${da?fmtDate(da):'&#x2014;'}</td>
   <td style="white-space:nowrap">
   <button class="btn btn-sm btn-ghost" onclick="editProduct('${p.id}')">Edit</button>
   <button class="btn btn-sm btn-ghost" onclick="restock('${p.id}')">Restock</button>
   <button class="btn btn-sm btn-ghost btn-danger" onclick="delProd('${p.id}')">Delete</button>
   </td></tr>`;}).join('');
 }

 window._invSort=function(key){
  if(sortCol===key){sortDir=sortDir==='asc'?'desc':'asc';}
  else{sortCol=key;sortDir='asc';}
  drawTable();
 };
 window._invRdw=drawTable;
 drawTable();
}

 showModal('Edit Product',`

 <div class="form-group"><label class="form-label">SKU <span style="color:var(--text3);font-weight:400">(not auto-changed on edit \u2014 edit manually if needed)</span></label><input class="form-input" id="fsku" value="${p.sku||''}" style="font-family:\'DM Mono\',monospace"/></div>
 <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px"><div class="form-group" style="margin-bottom:0"><label class="form-label">Sell Price (S$)</label><input class="form-input" type="number" id="fpsgd" value="${p.priceSGD||''}" placeholder="0.00" step="0.01" min="0"/></div>

 ()=>{
 // Snapshot ALL old values before any writes
 // Cast all values to strings before comparing — Sheets may return numbers
 const oldName=String(p.name||'');
 const oldSku=String(p.sku||'');
 const oldBrand=String(p.brand||'');
 const oldMake=String(p.make||'');
 const oldModel=String(p.model||'');
 const oldScaleCode=String(p.scaleCode||'');
 const oldVariantCode=String(p.variantCode||'');
 const oldBarcode=String(p.barcode||'');
 const oldCategory=String(p.category||'');
 const oldPrice=p.priceSGD||0;
 const oldCost=p.costSGD||0;
 const oldStock=p.stock;
 // Apply edits — SKU is read but NOT regenerated; whatever is in the field is kept as-is
 p.name=document.getElementById('fn').value.trim()||p.name;
 p.barcode=document.getElementById('fbarcode').value.trim();
 p.sku=document.getElementById('fsku').value.trim();
 p.brand=document.getElementById('fbrandcode').value;
 p.make=document.getElementById('fmakecode').value;
 p.model=document.getElementById('fmodelcode').value;
 p.scaleCode=document.getElementById('fscalecode').value;
 p.variantCode=document.getElementById('fvariantcode').value;
 const fpsgdVal=document.getElementById('fpsgd').value;
 const fcsgdVal=document.getElementById('fcsgd').value;
 p.priceSGD=fpsgdVal!==''?parseFloat(fpsgdVal):p.priceSGD||0;
 // NOTE: p.price (PHP sell price) is intentionally NOT touched by SGD POS
 p.costSGD=fcsgdVal!==''?parseFloat(fcsgdVal):p.costSGD||0;
 // Auto-compute PHP cost from SGD cost using the shared exchange rate
 p.cost=Math.round(p.costSGD*FX_RATE*100)/100;
 p.stock=parseInt(document.getElementById('fs').value)||0;
 p.category=document.getElementById('fcat').value.trim()||p.category;
 // Build movement note — only tracks name, SKU, brand, make, model, scale, variant, barcode, category and stock changes
 // Price changes (sell/cost) are logged separately in the Price Changes tab
 const changes=[];
 if(p.name!==oldName)             changes.push('Name: "'+oldName+'" \u2192 "'+p.name+'"');
 if(p.sku!==oldSku)               changes.push('SKU: "'+oldSku+'" \u2192 "'+p.sku+'"');
 if(p.barcode!==oldBarcode)       changes.push('Barcode: "'+oldBarcode+'" \u2192 "'+p.barcode+'"');
 if(p.brand!==oldBrand)           changes.push('Brand: "'+oldBrand+'" \u2192 "'+p.brand+'"');
 if(p.make!==oldMake)             changes.push('Make: "'+oldMake+'" \u2192 "'+p.make+'"');
 if(p.model!==oldModel)           changes.push('Model: "'+oldModel+'" \u2192 "'+p.model+'"');
 if(p.scaleCode!==oldScaleCode)   changes.push('Scale: "'+oldScaleCode+'" \u2192 "'+p.scaleCode+'"');
 if(p.variantCode!==oldVariantCode) changes.push('Variant: "'+oldVariantCode+'" \u2192 "'+p.variantCode+'"');
 if(p.category!==oldCategory)     changes.push('Category: "'+oldCategory+'" \u2192 "'+p.category+'"');
 const qtyChange=p.stock-oldStock;
 if(qtyChange!==0)                changes.push('Stock: '+oldStock+' \u2192 '+p.stock);
 // Only log movement if non-price attributes or stock actually changed
 if(changes.length>0||qtyChange!==0){
  const mvNote='Updated via Edit Product \u2014 '+changes.join(' | ');
  logMovement(p,'Updated',oldStock,qtyChange,mvNote);
 }
 // Log price change (handles sell+cost, skips if neither changed)
 const priceNote=document.getElementById('fpnote').value.trim();
 logPriceChange(p, oldPrice, p.priceSGD, oldCost, p.costSGD, priceNote);
 saveProduct(p);showSyncBanner('saving');if(window._invRdw)window._invRdw();return true;
 });
};

function pgSales(c){
 let fd='';
 let sortDir='desc'; // newest first by default

 // Render static shell once
 c.innerHTML=`<div class="content">
 <div class="grid-3">
 <div class="stat"><div class="stat-label">Transactions</div><div class="stat-value" id="sal-stat-count"></div></div>
 <div class="stat"><div class="stat-label">Revenue</div><div class="stat-value" id="sal-stat-rev"></div></div>
 <div class="stat"><div class="stat-label">Avg Order</div><div class="stat-value" id="sal-stat-avg"></div></div>
 </div>
 <div class="card">
 <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap">
  <div class="card-title" style="margin-bottom:0;flex:1">All Transactions</div>
  <input type="date" class="form-input" style="width:160px" id="dtf"/>
  <button class="btn btn-sm btn-ghost" id="clrdt" style="display:none">Clear</button>
 </div>
 <div class="table-wrap"><table>
  <thead><tr>
   <th>ID</th>
   <th id="sal-date-th" style="cursor:pointer;user-select:none;white-space:nowrap" onclick="window._salSort()">
    Date <span id="sal-sort-icon" style="color:var(--accent);font-size:10px">▼</span>
   </th>
   <th>Time</th><th>SKU</th><th>Products</th><th>Qty</th><th>Category</th>
   <th>Subtotal</th><th>GST</th><th>Total</th>
   <th>Payment</th><th>Cash Recv.</th><th>Change</th><th></th>
  </tr></thead>
  <tbody id="sal-tbody"></tbody>
 </table></div>
 </div>
 </div>`;

 // Wire date filter ONCE
 const dtf=document.getElementById('dtf');
 const clrdt=document.getElementById('clrdt');
 dtf.addEventListener('change',e=>{fd=e.target.value;clrdt.style.display=fd?'':'none';drawTable();});
 clrdt.addEventListener('click',()=>{fd='';dtf.value='';clrdt.style.display='none';drawTable();});

 function drawTable(){
  // Filter
  let txs=[...DB.transactions];
  if(fd) txs=txs.filter(t=>t.date===fd);
  // Sort by date+time
  txs.sort((a,b)=>{
   const ak=(a.date||'')+(a.time||'');
   const bk=(b.date||'')+(b.time||'');
   return sortDir==='desc'?bk.localeCompare(ak):ak.localeCompare(bk);
  });
  // Update stats
  const rev=txs.reduce((s,t)=>s+t.total,0);
  document.getElementById('sal-stat-count').textContent=txs.length;
  document.getElementById('sal-stat-rev').textContent=fmt(rev);
  document.getElementById('sal-stat-avg').textContent=fmt(txs.length?rev/txs.length:0);
  // Update sort icon
  document.getElementById('sal-sort-icon').textContent=sortDir==='desc'?'▼':'▲';
  // Render tbody
  document.getElementById('sal-tbody').innerHTML=txs.length===0
   ?`<tr><td colspan="14" style="text-align:center;padding:40px;color:var(--text3)">No transactions found</td></tr>`
   :txs.map(t=>{
    // Collect unique categories from items in this transaction
    const cats=[...new Set((t.items||[]).map(i=>{
     const p=DB.products.find(x=>x.id===i.id);
     return p?p.category:(i.category||'');
    }).filter(Boolean))];
    const catLabel=cats.length?cats.join(', '):'—';
    return`<tr>
    <td style="font-family:'DM Mono',monospace;font-size:11px;color:var(--text3)">${t.id}</td>
    <td>${fmtDate(t.date)}</td>
    <td>${t.time||'—'}</td>
    <td style="font-family:'DM Mono',monospace;font-size:11px;color:var(--text3);max-width:120px">${(t.items||[]).map(i=>i.sku||'—').join(', ')}</td>
    <td style="font-size:12px;max-width:180px">${(t.items||[]).map(i=>i.name).join(', ')}</td>
    <td style="font-size:12px">${(t.items||[]).reduce((s,i)=>s+i.qty,0)}</td>
    <td style="font-size:12px;max-width:150px">${catLabel}</td>
    <td>${fmt(t.subtotal)}</td>
    <td>${fmt(t.tax)}</td>
    <td style="font-weight:700">${fmt(t.total)}</td>
    <td><span class="badge badge-gray">${t.payment}</span></td>
    <td style="font-family:'DM Mono',monospace">${t.payment==='Cash'?fmt(t.cashTendered||0):'—'}</td>
    <td style="font-family:'DM Mono',monospace;color:var(--green);font-weight:600">${t.payment==='Cash'?fmt(t.change||0):'—'}</td>
    <td><button class="btn btn-sm btn-ghost" onclick="viewTx('${t.id}')">View</button></td>
    </tr>`;
   }).join('');
 }

 window._salSort=function(){
  sortDir=sortDir==='desc'?'asc':'desc';
  drawTable();
 };

 drawTable();
}

function pgAcct(c){
 const tRev=DB.transactions.reduce((s,t)=>s+t.total,0);
 const tCOGS=DB.transactions.reduce((s,t)=>(t.items||[]).reduce((ss,i)=>{const p=DB.products.find(x=>x.id===i.id);return ss+(p?p.costSGD||0:i.cost||0)*i.qty;},s),0);
 const tExp=DB.expenses.reduce((s,e)=>s+(e.amountSGD||0),0);
 const gross=tRev-tCOGS;const net=gross-tExp;
 const gm=tRev>0?(gross/tRev*100).toFixed(1):0;
 const nm=tRev>0?(net/tRev*100).toFixed(1):0;
 const ebc={};DB.expenses.forEach(e=>{ebc[e.category]=(ebc[e.category]||0)+e.amount;});
 const months=getMonthly();
 c.innerHTML=`<div class="content">
 <div class="grid-4">
 <div class="stat"><div class="stat-label">Total Revenue</div><div class="stat-value">${fmt(tRev)}</div></div>
 <div class="stat"><div class="stat-label">COGS</div><div class="stat-value">${fmt(tCOGS)}</div></div>
 <div class="stat"><div class="stat-label">Gross Profit</div><div class="stat-value ${gross>=0?'profit-positive':'profit-negative'}">${fmt(gross)}</div><div class="stat-sub">Margin: ${gm}%</div></div>
 <div class="stat"><div class="stat-label">Net Profit</div><div class="stat-value ${net>=0?'profit-positive':'profit-negative'}">${fmt(net)}</div><div class="stat-sub">Net margin: ${nm}%</div></div>
 </div>
 <div class="grid-2">
 <div class="card"><div class="card-title">Profit & Loss Statement</div>
 <table style="width:100%;font-size:13px">
 <tr><td style="padding:7px 0;color:var(--text2)">Revenue</td><td style="text-align:right;font-weight:500">${fmt(tRev)}</td></tr>
 <tr><td style="padding:7px 0;color:var(--text2)">Cost of Goods Sold</td><td style="text-align:right;color:var(--red-text)">−${fmt(tCOGS)}</td></tr>
 <tr style="border-top:1px solid var(--border)"><td style="padding:8px 0;font-weight:600">Gross Profit</td><td style="text-align:right;font-weight:600">${fmt(gross)}</td></tr>
 ${Object.entries(ebc).map(([k,v])=>`<tr><td style="padding:5px 0;color:var(--text2);font-size:12px;padding-left:12px">${k}</td><td style="text-align:right;color:var(--red-text);font-size:12px">−${fmt(v)}</td></tr>`).join('')}
 <tr style="border-top:1px solid var(--border)"><td style="padding:7px 0;color:var(--text2)">Total Expenses</td><td style="text-align:right;color:var(--red-text)">−${fmt(tExp)}</td></tr>
 <tr style="border-top:2px solid var(--border)"><td style="padding:10px 0;font-weight:700;font-size:15px">Net Profit</td><td style="text-align:right;font-weight:700;font-size:15px;${net>=0?'color:var(--green)':'color:var(--red)'}">${fmt(net)}</td></tr>
 </table>
 </div>
 <div class="card"><div class="card-title">Monthly Breakdown</div>
 ${months.length===0?`<div style="color:var(--text3);text-align:center;padding:20px 0">No data yet</div>`:`
 <div class="table-wrap"><table>
 <thead><tr><th>Month</th><th style="text-align:right">Revenue</th><th style="text-align:right">COGS</th><th style="text-align:right">Gross P.</th></tr></thead>
 <tbody>${months.map(m=>`<tr>
 <td style="padding:6px 8px">${m.label}</td>
 <td style="text-align:right;padding:6px 8px">${fmt(m.rev)}</td>
 <td style="text-align:right;padding:6px 8px;color:var(--red-text)">${fmt(m.cogs)}</td>
 <td style="text-align:right;padding:6px 8px;font-weight:500;${m.profit>=0?'color:var(--green)':'color:var(--red)'}">${fmt(m.profit)}</td>
 </tr>`).join('')}</tbody>
 </table></div>`}
 </div>
 </div>
 </div>`;
}
function getMonthly(){
 const m={};
 DB.transactions.forEach(t=>{
 const k=t.date.slice(0,7);
 if(!m[k])m[k]={rev:0,cogs:0};
 m[k].rev+=t.total;
 (t.items||[]).forEach(i=>{const p=DB.products.find(x=>x.id===i.id);if(p)m[k].cogs+=(p.costSGD||0)*i.qty;});
 });
 return Object.entries(m).sort((a,b)=>a[0].localeCompare(b[0])).map(([k,v])=>({label:new Date(k+'-01').toLocaleDateString('en-SG',{month:'short',year:'numeric'}),...v,profit:v.rev-v.cogs}));
}

 </tbody>

 window._expRdw=redraw;

window.addExpense=function(){
 // Wire exchange rate + auto-compute PHP amount from SGD after modal renders
 setTimeout(()=>{
  const fxEl=document.getElementById('fxrate');
  const sgdEl=document.getElementById('fasgd');
  const phpEl=document.getElementById('fa');
  function recompute(){
   const sgd=parseFloat(sgdEl.value)||0;
   const rate=parseFloat(fxEl.value)||FX_RATE;
   FX_RATE=rate;localStorage.setItem('fx_rate',FX_RATE);
   if(sgd>=0&&phpEl) phpEl.value=(sgd*rate).toFixed(2);
  }
  if(fxEl) fxEl.addEventListener('input',recompute);
  if(sgdEl) sgdEl.addEventListener('input',recompute);
 },50);
 showModal('Add Expense',`
 <div class="form-row"><div class="form-group"><label class="form-label">Date</label><input class="form-input" type="date" id="fd" value="${today()}"/></div>
 <div class="form-group"><label class="form-label">Category</label>
 <select class="form-input" id="fcat"><option>Rent</option><option>Utilities</option><option>Supplier</option><option>Salaries</option><option>Marketing</option><option>Maintenance</option><option>Transport</option><option>Other</option></select>
 </div></div>
 <div style="background:var(--accent-bg);border:1px solid var(--accent);border-radius:var(--radius-sm);padding:8px 12px;margin-bottom:12px;display:flex;align-items:center;gap:10px">
 <span style="font-size:12px;color:var(--accent-text);font-weight:500">S$ → ₱ Exchange Rate:</span>
 <input class="form-input" type="number" id="fxrate" value="${FX_RATE}" step="0.01" min="1" style="width:90px;padding:4px 8px;font-size:13px;font-family:'DM Mono',monospace;font-weight:600"/>
 <span style="font-size:11px;color:var(--accent-text)">Saved automatically</span>
 </div>
 <div class="form-row"><div class="form-group"><label class="form-label">Amount (S$)</label><input class="form-input" type="number" id="fasgd" placeholder="0.00" step="0.01" min="0"/></div>
 <div class="form-group"><label class="form-label">Amount (₱) <span style="color:var(--text3);font-weight:400">(auto-computed)</span></label><input class="form-input" type="number" id="fa" placeholder="0.00" step="0.01" min="0"/></div></div>
 <div class="form-group"><label class="form-label">Description</label><input class="form-input" id="fdesc" placeholder="Brief description…"/></div>`,
 ()=>{
 const date=document.getElementById('fd').value;
 const faVal=document.getElementById('fa').value;
 const fasgdVal=document.getElementById('fasgd').value;
 const amountSGD=fasgdVal!==''?parseFloat(fasgdVal):0;  // S$ — primary
 const amount=faVal!==''?parseFloat(faVal):Math.round(amountSGD*FX_RATE*100)/100; // PHP — auto-computed
 const cat=document.getElementById('fcat').value;
 const desc=document.getElementById('fdesc').value.trim();
 if(!date||isNaN(amountSGD)||amountSGD<0){alert('Fill in date and a valid S$ amount.');return false;}
 const newE={id:'e'+uid(),date,category:cat,desc:desc||cat,amount,amountSGD};
 DB.expenses.push(newE);
 saveExpense(newE);showSyncBanner('saving');if(window._expRdw)window._expRdw();return true;
 });
};
window.delExp=function(id){

 DB.expenses=DB.expenses.filter(e=>e.id!==id);deleteExpense(id);showSyncBanner('saving');
 if(window._expRdw)window._expRdw();
};
window.editExpense=function(id){
 const e=DB.expenses.find(x=>x.id===id);if(!e)return;
 // Wire exchange rate + PHP auto-compute after modal renders
 setTimeout(()=>{
  const fxEl=document.getElementById('fxrate');
  const sgdEl=document.getElementById('fasgd');
  const phpEl=document.getElementById('fa');
  function recompute(){
   const sgd=parseFloat(sgdEl.value)||0;
   const rate=parseFloat(fxEl.value)||FX_RATE;
   FX_RATE=rate;localStorage.setItem('fx_rate',FX_RATE);
   if(sgd>=0&&phpEl) phpEl.value=(sgd*rate).toFixed(2);
  }
  if(fxEl) fxEl.addEventListener('input',recompute);
  if(sgdEl) sgdEl.addEventListener('input',recompute);
 },50);
 showModal('Edit Expense',`
 <div class="form-row"><div class="form-group"><label class="form-label">Date</label><input class="form-input" type="date" id="fd" value="${e.date}"/></div>
 <div class="form-group"><label class="form-label">Category</label>
 <select class="form-input" id="fcat"><option>Rent</option><option>Utilities</option><option>Supplier</option><option>Salaries</option><option>Marketing</option><option>Maintenance</option><option>Transport</option><option>Other</option></select>
 </div></div>
 <div style="background:var(--accent-bg);border:1px solid var(--accent);border-radius:var(--radius-sm);padding:8px 12px;margin-bottom:12px;display:flex;align-items:center;gap:10px">
 <span style="font-size:12px;color:var(--accent-text);font-weight:500">S$ → ₱ Exchange Rate:</span>
 <input class="form-input" type="number" id="fxrate" value="${FX_RATE}" step="0.01" min="1" style="width:90px;padding:4px 8px;font-size:13px;font-family:'DM Mono',monospace;font-weight:600"/>
 <span style="font-size:11px;color:var(--accent-text)">Saved automatically</span>
 </div>
 <div class="form-row"><div class="form-group"><label class="form-label">Amount (S$)</label><input class="form-input" type="number" id="fasgd" value="${e.amountSGD||''}" placeholder="0.00" step="0.01" min="0"/></div>
 <div class="form-group"><label class="form-label">Amount (₱) <span style="color:var(--text3);font-weight:400">(auto-computed)</span></label><input class="form-input" type="number" id="fa" value="${e.amount||''}" placeholder="0.00" step="0.01" min="0"/></div></div>
 <div class="form-group"><label class="form-label">Description</label><input class="form-input" id="fdesc" value="${e.desc||''}"/></div>`,
 ()=>{
  const date=document.getElementById('fd').value;
  const amountSGD=parseFloat(document.getElementById('fasgd').value)||0;
  const amount=parseFloat(document.getElementById('fa').value)||0;
  const cat=document.getElementById('fcat').value;
  const desc=document.getElementById('fdesc').value.trim();
  if(!date||isNaN(amountSGD)||amountSGD<0){alert('Fill in date and a valid S$ amount.');return false;}
  e.date=date;e.category=cat;e.desc=desc||cat;e.amount=amount;e.amountSGD=amountSGD;
  saveExpense(e);showSyncBanner('saving');if(window._expRdw)window._expRdw();return true;
 });
 // Pre-select category after modal renders
 setTimeout(()=>{
  const sel=document.getElementById('fcat');
  if(sel){[...sel.options].forEach((o,i)=>{if(o.value===e.category)sel.selectedIndex=i;});}
 },60);
};

// 
// DATABASE MANAGER
// 
let dbTab='sales';
let dbSearch='';      // persists across redraws, cleared on tab switch
let dbSalesSort='desc'; // date sort for sales tab: 'asc' | 'desc'
let dbExpSort='desc';
let dbMovSort='desc';
let dbPcSort='desc';

function pgDB(c){
 document.getElementById('topbar-actions').innerHTML='';

 // ── Render static shell once ────────────────────────────────
 c.innerHTML=`<div class="content" style="display:flex;flex-direction:column;height:100%">
 <div id="db-danger-zone" class="danger-zone">
  <div>
   <div class="dz-text">⚠ Danger Zone — Permanent Deletion</div>
   <div class="dz-sub">All deletions are immediate and cannot be undone.</div>
  </div>
  <div id="db-dz-btns" style="display:flex;gap:8px;flex-wrap:wrap"></div>
 </div>
 <div class="card" style="margin-bottom:0;display:flex;flex-direction:column;flex:1;min-height:0">
  <div id="db-tab-bar" class="tab-bar"></div>
  <div class="search-bar" style="margin-bottom:10px">
   <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><circle cx="6.5" cy="6.5" r="5" stroke="var(--text3)" stroke-width="1.5"/><path d="M10.5 10.5l3 3" stroke="var(--text3)" stroke-width="1.5" stroke-linecap="round"/></svg>
   <input id="db-search" placeholder="Search…" style="flex:1;border:none;outline:none;font-size:13px;font-family:inherit;color:var(--text);background:transparent"/>
  </div>
  <div id="db-sel-row" style="display:flex;align-items:center;gap:8px;margin-bottom:8px"></div>
  <div id="db-table-wrap" class="table-wrap" style="flex:1;overflow-y:auto"></div>
 </div>
 </div>`;

 // Wire search input ONCE
 document.getElementById('db-search').addEventListener('input', e=>{
  dbSearch=e.target.value;
  drawTable();
 });

 function updateTabBar(){
  document.getElementById('db-tab-bar').innerHTML=
   ['sales','products','expenses','movements','pricechanges'].map(t=>{
    const labels={sales:'Sales',products:'Products',expenses:'Expenses',movements:'Inventory Movements',pricechanges:'Price Changes'};
    const counts={sales:DB.transactions.length,products:DB.products.length,expenses:DB.expenses.length,movements:DB.movements.length,pricechanges:DB.priceChanges.length};
    return`<div class="tab ${dbTab===t?'active':''}" onclick="window._dbt('${t}')">${labels[t]} (${counts[t]})</div>`;
   }).join('');
 }

 function updateDangerZone(){
  const selTx=DB.transactions.filter(t=>t._sel);
  const selP=DB.products.filter(p=>p._sel);
  const selE=DB.expenses.filter(e=>e._sel);
  const selM=DB.movements.filter(m=>m._sel);
  const selPC=DB.priceChanges.filter(pc=>pc._sel);
  const btns=[];
  if(dbTab==='sales'&&selTx.length)    btns.push(`<button class="btn btn-danger btn-sm" onclick="delSelTx()">Delete selected (${selTx.length})</button>`);
  if(dbTab==='products'&&selP.length)  btns.push(`<button class="btn btn-danger btn-sm" onclick="delSelP()">Delete selected (${selP.length})</button>`);
  if(dbTab==='expenses'&&selE.length)  btns.push(`<button class="btn btn-danger btn-sm" onclick="delSelE()">Delete selected (${selE.length})</button>`);
  if(dbTab==='movements'&&selM.length) btns.push(`<button class="btn btn-danger btn-sm" onclick="delSelM()">Delete selected (${selM.length})</button>`);
  if(dbTab==='pricechanges'&&selPC.length) btns.push(`<button class="btn btn-danger btn-sm" onclick="delSelPC()">Delete selected (${selPC.length})</button>`);
  btns.push(`<button class="btn btn-danger btn-sm" onclick="clearAll('${dbTab}')">⚠ Clear all ${dbTab}</button>`);
  document.getElementById('db-dz-btns').innerHTML=btns.join('');
 }

 function getPlaceholder(){
  const ph={
   sales:'Search by transaction ID, product name, or payment method…',
   products:'Search by SKU, product name, brand, make, model or category…',
   expenses:'Search by category or description…',
   movements:'Search by SKU, product name or action…',
   pricechanges:'Search by SKU, product name or action…'
  };
  return ph[dbTab]||'Search…';
 }

 function drawTable(){
  const s=dbSearch.toLowerCase().trim();
  updateTabBar();
  updateDangerZone();
  document.getElementById('db-search').placeholder=getPlaceholder();

  if(dbTab==='sales'){
   let rows=[...DB.transactions];
   if(s){const kws=s.split(',').map(k=>k.trim().toLowerCase()).filter(Boolean);kws.forEach(k=>{rows=rows.filter(t=>String(t.id||'').toLowerCase().includes(k)||String(t.payment||'').toLowerCase().includes(k)||(t.items||[]).some(i=>String(i.name||'').toLowerCase().includes(k)||String(i.sku||'').toLowerCase().includes(k)));});}
   // Sort by date+time
   rows.sort((a,b)=>{
    const ak=(a.date||'')+(a.time||'');
    const bk=(b.date||'')+(b.time||'');
    return dbSalesSort==='desc'?bk.localeCompare(ak):ak.localeCompare(bk);
   });
   const sortIcon=dbSalesSort==='desc'?'▼':'▲';
   document.getElementById('db-sel-row').innerHTML=`
    <label style="font-size:12px;display:flex;align-items:center;gap:5px;cursor:pointer"><input type="checkbox" id="sa-tx" onchange="window._satx(this.checked)"/> Select all visible</label>
    <span style="font-size:12px;color:var(--text3)">${rows.length} of ${DB.transactions.length} records</span>`;
   document.getElementById('db-table-wrap').innerHTML=`<table>
    <thead><tr>
     <th></th>
     <th>ID</th>
     <th style="cursor:pointer;user-select:none;white-space:nowrap" onclick="window._dbSalSort()">
      Date <span style="color:var(--accent);font-size:10px">${sortIcon}</span>
     </th>
     <th>Time</th><th>SKU</th><th>Items</th><th>Total</th><th>Payment</th><th>Cash Recv.</th><th>Change</th>
     <th>Cost Price</th>
     <th>Action</th>
    </tr></thead>
    <tbody>
    ${rows.length===0?`<tr><td colspan="12" style="text-align:center;padding:30px;color:var(--text3)">${s?'No results for "'+dbSearch+'"':'No sales records'}</td></tr>`:''}
    ${rows.map(t=>{
     // Sum cost of all items in this transaction
     const totalCost=(t.items||[]).reduce((sum,i)=>{
      const prod=DB.products.find(x=>x.id===i.id);
      const unitCost=prod?prod.cost:(i.cost||0);
      return sum+unitCost*i.qty;
     },0);
     return`<tr>
      <td><input type="checkbox" ${t._sel?'checked':''} onchange="window._stx('${t.id}',this.checked)"/></td>
      <td style="font-family:'DM Mono',monospace;font-size:11px;color:var(--text3)">${t.id}</td>
      <td>${fmtDate(t.date)}</td><td>${t.time||'—'}</td>
      <td style="font-family:'DM Mono',monospace;font-size:11px;color:var(--text3);max-width:120px">${(t.items||[]).map(i=>i.sku||'—').join(', ')}</td>
      <td style="font-size:12px;max-width:200px;white-space:normal">${(t.items||[]).map(i=>`${i.name} x${i.qty}`).join(', ')}</td>
      <td style="font-weight:700">${fmt(t.total)}</td>
      <td><span class="badge badge-gray">${t.payment}</span></td>
      <td style="font-family:'DM Mono',monospace">${t.payment==='Cash'?fmt(t.cashTendered||0):'—'}</td>
      <td style="font-family:'DM Mono',monospace;color:var(--green);font-weight:600">${t.payment==='Cash'?fmt(t.change||0):'—'}</td>
      <td style="font-family:'DM Mono',monospace;color:var(--text2)">${fmt(totalCost)}</td>
      <td><button class="btn btn-sm btn-ghost btn-danger" onclick="delOneTx('${t.id}')">Delete</button></td>
     </tr>`;}).join('')}
    </tbody></table>`;
  }

  else if(dbTab==='products'){
   let rows=DB.products;
   if(s){const kws=s.split(',').map(k=>k.trim().toLowerCase()).filter(Boolean);kws.forEach(k=>{rows=rows.filter(p=>String(p.sku||'').toLowerCase().includes(k)||String(p.barcode||'').toLowerCase().includes(k)||String(p.name||'').toLowerCase().includes(k)||String(p.brand||'').toLowerCase().includes(k)||String(p.make||'').toLowerCase().includes(k)||String(p.model||'').toLowerCase().includes(k)||String(p.category||'').toLowerCase().includes(k));});}
   document.getElementById('db-sel-row').innerHTML=`
    <label style="font-size:12px;display:flex;align-items:center;gap:5px;cursor:pointer"><input type="checkbox" id="sa-p" onchange="window._sap(this.checked)"/> Select all visible</label>
    <span style="font-size:12px;color:var(--text3)">${rows.length} of ${DB.products.length} products</span>`;
   document.getElementById('db-table-wrap').innerHTML=`<table>
    <thead><tr><th></th><th>SKU</th><th>Barcode</th><th>Product</th><th>Brand</th><th>Model</th><th>Make</th><th>Category</th><th>Price (S$)</th><th>Cost (S$)</th><th>Stock</th><th>Date Added</th><th>Record ID</th><th>Action</th></tr></thead>
    <tbody>
    ${rows.length===0?`<tr><td colspan="14" style="text-align:center;padding:30px;color:var(--text3)">${s?'No results for "'+dbSearch+'"':'No products'}</td></tr>`:''}
    ${rows.map(p=>`<tr>
     <td><input type="checkbox" ${p._sel?'checked':''} onchange="window._sp('${p.id}',this.checked)"/></td>
     <td style="font-family:'DM Mono',monospace;font-size:11px;color:var(--text3);white-space:nowrap">${p.sku||'—'}</td>
     <td style="font-family:'DM Mono',monospace;font-size:11px;color:var(--text3);white-space:nowrap">${p.barcode||'—'}</td>
     <td><strong style="font-weight:500">${p.name}</strong></td>
     <td>${p.brand||'—'}</td><td>${p.model||'—'}</td><td>${p.make||'—'}</td>
     <td><span class="badge badge-gray">${p.category}</span></td>
     <td>${fmt(p.priceSGD||0)}</td><td>${fmt(p.costSGD||0)}</td>
     <td style="font-weight:700">${p.stock}</td>
     <td style="color:var(--text2);font-size:12px">${(()=>{const da=toDateStr(p.dateAdded)||toDateStr(p.createdAt)||'';return da?fmtDate(da):'—';})()}</td>
     <td style="font-family:'DM Mono',monospace;font-size:11px;color:var(--text3)">${p.id}</td>
     <td><button class="btn btn-sm btn-ghost btn-danger" onclick="delOneP('${p.id}')">Delete</button></td>
    </tr>`).join('')}
    </tbody></table>`;
  }

  else if(dbTab==='expenses'){
   let rows=[...DB.expenses];
   if(s){const kws=s.split(',').map(k=>k.trim().toLowerCase()).filter(Boolean);kws.forEach(k=>{rows=rows.filter(e=>String(e.category||'').toLowerCase().includes(k)||String(e.desc||'').toLowerCase().includes(k)||String(e.id||'').toLowerCase().includes(k));});}
   rows.sort((a,b)=>b.date.localeCompare(a.date));
   document.getElementById('db-sel-row').innerHTML=`
    <label style="font-size:12px;display:flex;align-items:center;gap:5px;cursor:pointer"><input type="checkbox" id="sa-e" onchange="window._sae(this.checked)"/> Select all visible</label>
    <span style="font-size:12px;color:var(--text3)">${rows.length} of ${DB.expenses.length} records</span>`;
   document.getElementById('db-table-wrap').innerHTML=`<table>
    <thead><tr><th></th><th>Date</th><th>Category</th><th>Description</th><th>Amount (S$)</th><th>Amount (₱) ref</th><th>Record ID</th><th>Action</th></tr></thead>
    <tbody>
    ${rows.length===0?`<tr><td colspan="8" style="text-align:center;padding:30px;color:var(--text3)">${s?'No results for "'+dbSearch+'"':'No expenses'}</td></tr>`:''}
    ${rows.map(e=>`<tr>
     <td><input type="checkbox" ${e._sel?'checked':''} onchange="window._se('${e.id}',this.checked)"/></td>
     <td>${fmtDate(e.date)}</td>
     <td><span class="badge badge-amber">${e.category}</span></td>
     <td>${e.desc}</td>
     <td style="font-weight:500">${e.amountSGD?'S$'+Number(e.amountSGD).toFixed(2):'—'}</td>
     <td style="color:var(--text2)">${e.amount?'₱'+Number(e.amount).toFixed(2):'—'}</td>
     <td style="font-family:'DM Mono',monospace;font-size:11px;color:var(--text3)">${e.id}</td>
     <td style="white-space:nowrap"><button class="btn btn-sm btn-ghost" onclick="editExpense('${e.id}')">Edit</button> <button class="btn btn-sm btn-ghost btn-danger" onclick="delOneE('${e.id}')">Delete</button></td>
    </tr>`).join('')}
    </tbody></table>`;
  }

  else if(dbTab==='movements'){
   let rows=[...DB.movements];
   if(s){const kws=s.split(',').map(k=>k.trim().toLowerCase()).filter(Boolean);kws.forEach(k=>{rows=rows.filter(m=>String(m.sku||'').toLowerCase().includes(k)||String(m.productName||'').toLowerCase().includes(k)||String(m.action||'').toLowerCase().includes(k)||String(m.note||'').toLowerCase().includes(k));});}
   rows.sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));
   document.getElementById('db-sel-row').innerHTML=`
    <label style="font-size:12px;display:flex;align-items:center;gap:5px;cursor:pointer"><input type="checkbox" id="sa-m" onchange="window._sam(this.checked)"/> Select all visible</label>
    <span style="font-size:12px;color:var(--text3)">${rows.length} of ${DB.movements.length} records</span>`;
   document.getElementById('db-table-wrap').innerHTML=`<table>
    <thead><tr><th></th><th>Date</th><th>Time</th><th>SKU</th><th>Product</th><th>Action</th><th>Qty Before</th><th>Qty Change</th><th>Qty After</th><th>Note</th><th>Record ID</th><th>Action</th></tr></thead>
    <tbody>
    ${rows.length===0?`<tr><td colspan="12" style="text-align:center;padding:30px;color:var(--text3)">${s?'No results for "'+dbSearch+'"':'No inventory movements recorded yet'}</td></tr>`:''}
    ${rows.map(m=>{
     const ac=m.action==='Sold'?'badge-red':m.action==='Restocked'?'badge-green':m.action==='Added'?'badge-blue':m.action==='Deleted'?'badge-red':'badge-gray';
     const sign=m.qtyChange>0?'+':'';
     return`<tr>
      <td><input type="checkbox" ${m._sel?'checked':''} onchange="window._sm('${m.id}',this.checked)"/></td>
      <td>${fmtDate(m.date)}</td><td>${m.time||'—'}</td>
      <td style="font-family:'DM Mono',monospace;font-size:11px;color:var(--text3)">${m.sku||'—'}</td>
      <td style="font-weight:500">${m.productName}</td>
      <td><span class="badge ${ac}">${m.action}</span></td>
      <td>${m.qtyBefore}</td>
      <td style="font-weight:600;${m.qtyChange<0?'color:var(--red)':'color:var(--green)'}">${sign}${m.qtyChange}</td>
      <td style="font-weight:600">${m.qtyAfter}</td>
      <td style="font-size:12px;color:var(--text2)">${m.note||'—'}</td>
      <td style="font-family:'DM Mono',monospace;font-size:11px;color:var(--text3)">${m.id}</td>
      <td><button class="btn btn-sm btn-ghost btn-danger" onclick="delOneM('${m.id}')">Delete</button></td>
     </tr>`;}).join('')}
    </tbody></table>`;
  }

  else if(dbTab==='pricechanges'){
   let rows=[...DB.priceChanges];
   if(s){const kws=s.split(',').map(k=>k.trim().toLowerCase()).filter(Boolean);kws.forEach(k=>{rows=rows.filter(pc=>String(pc.sku||'').toLowerCase().includes(k)||String(pc.productName||'').toLowerCase().includes(k)||String(pc.action||'').toLowerCase().includes(k)||String(pc.note||'').toLowerCase().includes(k));});}
   rows.sort((a,b)=>{
    const ak=(a.date||'')+(a.time||'');
    const bk=(b.date||'')+(b.time||'');
    return dbPcSort==='desc'?bk.localeCompare(ak):ak.localeCompare(bk);
   });
   const pcIcon=dbPcSort==='desc'?'▼':'▲';
   document.getElementById('db-sel-row').innerHTML=`
    <label style="font-size:12px;display:flex;align-items:center;gap:5px;cursor:pointer"><input type="checkbox" id="sa-pc" onchange="window._sapc(this.checked)"/> Select all visible</label>
    <span style="font-size:12px;color:var(--text3)">${rows.length} of ${DB.priceChanges.length} records</span>`;
   document.getElementById('db-table-wrap').innerHTML=`<table>
    <thead><tr>
     <th></th>
     <th style="cursor:pointer;user-select:none;white-space:nowrap" onclick="window._dbPcSort()">
      Date <span style="color:var(--accent);font-size:10px">${pcIcon}</span>
     </th>
     <th>Time</th><th>SKU</th><th>Product</th><th>Action</th>
     <th style="text-align:right">Old Sell</th><th style="text-align:right">New Sell</th><th style="text-align:center">+/-</th>
     <th style="text-align:right">Old Cost</th><th style="text-align:right">New Cost</th><th style="text-align:center">+/-</th>
     <th>Note</th><th>Record ID</th><th>Action</th>
    </tr></thead>
    <tbody>
    ${rows.length===0?`<tr><td colspan="14" style="text-align:center;padding:30px;color:var(--text3)">${s?'No results for "'+dbSearch+'"':'No price changes recorded yet. Changes are automatically logged when you edit a product\'s sell or cost price.'}</td></tr>`:''}
    ${rows.map(pc=>{
     const sellChanged=pc.change!==0&&pc.change!=='';
     const costChanged=pc.costChange!==0&&pc.costChange!=='';
     const badgeClass=pc.action==='Sell Price Increase'||pc.action==='Cost Price Increase'?'badge-green':pc.action==='Sell & Cost Price Change'?'badge-blue':'badge-red';
     const sellSign=pc.change>0?'+':'';
     const costSign=pc.costChange>0?'+':'';
     return`<tr>
      <td><input type="checkbox" ${pc._sel?'checked':''} onchange="window._spc('${pc.id}',this.checked)"/></td>
      <td>${fmtDate(pc.date)}</td><td>${pc.time||'—'}</td>
      <td style="font-family:'DM Mono',monospace;font-size:11px;color:var(--text3)">${pc.sku||'—'}</td>
      <td style="font-weight:500">${pc.productName}</td>
      <td><span class="badge ${badgeClass}">${pc.action}</span></td>
      <td style="text-align:right;font-family:'DM Mono',monospace">${sellChanged?fmt(pc.oldPrice):'—'}</td>
      <td style="text-align:right;font-family:'DM Mono',monospace;font-weight:600">${sellChanged?fmt(pc.newPrice):'—'}</td>
      <td style="text-align:right;font-family:'DM Mono',monospace;font-weight:700;${pc.change>0?'color:var(--green)':pc.change<0?'color:var(--red)':''}">${sellChanged?sellSign+fmt(pc.change):'—'}</td>
      <td style="text-align:right;font-family:'DM Mono',monospace">${costChanged?fmt(pc.oldCost):'—'}</td>
      <td style="text-align:right;font-family:'DM Mono',monospace;font-weight:600">${costChanged?fmt(pc.newCost):'—'}</td>
      <td style="text-align:right;font-family:'DM Mono',monospace;font-weight:700;${pc.costChange>0?'color:var(--green)':pc.costChange<0?'color:var(--red)':''}">${costChanged?costSign+fmt(pc.costChange):'—'}</td>
      <td style="font-size:12px;color:var(--text2);max-width:200px">${pc.note||'—'}</td>
      <td style="font-family:'DM Mono',monospace;font-size:11px;color:var(--text3)">${pc.id}</td>
      <td><button class="btn btn-sm btn-ghost btn-danger" onclick="delOnePC('${pc.id}')">Delete</button></td>
     </tr>`;}).join('')}
    </tbody></table>`;
  }
 }

 window._dbt=t=>{dbTab=t;dbSearch='';const si=document.getElementById('db-search');if(si)si.value='';drawTable();document.getElementById('topbar-actions').innerHTML=`<button class="btn btn-sm" onclick="exportCSV('${t}')">Export CSV</button>`;};

// 
// INVENTORY MOVEMENT LOGGER
// 
// 
// SKU GENERATION SYSTEM
// Builds SKU as BrandCode-ScaleCode-ModelCode-VariantCode-MakeCode-SequenceCode
// Sequence is computed live by scanning existing products for the same
// Brand-Scale-Model-Variant-Make combo prefix, taking the highest found +1.
// 

// Returns the lookup array's code-column key name for a given lookup type.
// (Codes are read generically since sheet headers may vary in exact casing.)
function getLookupCode(row, fallbackKey){
 if(!row) return '';
 // Try the canonical header name first, then fall back to first column value
 const keys=Object.keys(row);
 const exact=keys.find(k=>k.toLowerCase()===fallbackKey.toLowerCase());
 if(exact) return String(row[exact]||'').trim();
 return keys.length?String(row[keys[0]]||'').trim():'';
}

// Builds a dropdown <option> list showing "Code — Description" but storing only the code.
function buildLookupOptions(list, codeHeader){
 return list.map(row=>{
  const code=getLookupCode(row,codeHeader);
  const keys=Object.keys(row);
  const descKey=keys.find(k=>k.toLowerCase()!==codeHeader.toLowerCase());
  const desc=descKey?String(row[descKey]||'').trim():'';
  const label=desc?`${code} — ${desc}`:code;
  return `<option value="${code}">${label}</option>`;
 }).join('');
}

// Computes the next sequence number (4-digit, zero-padded, starting at 0001) for a given combo.
function getNextSequence(brandCode, scaleCode, modelCode, variantCode, makeCode){
 const prefix=[brandCode,scaleCode,modelCode,variantCode,makeCode].join('-').toUpperCase();
 let maxSeq=0;
 DB.products.forEach(p=>{
  if(!p.sku) return;
  const parts=p.sku.toUpperCase().split('-');
  if(parts.length<6) return;
  const skuPrefix=parts.slice(0,5).join('-');
  if(skuPrefix===prefix){
   const seqStr=parts[5];
   const seqNum=parseInt(seqStr,10);
   if(!isNaN(seqNum)&&seqNum>maxSeq) maxSeq=seqNum;
  }
 });
 return String(maxSeq+1).padStart(4,'0');
}

// Builds the full SKU string from the 5 dropdown codes.
function buildSKU(brandCode, scaleCode, modelCode, variantCode, makeCode){
 if(!brandCode||!scaleCode||!modelCode||!variantCode||!makeCode) return '';
 const seq=getNextSequence(brandCode, scaleCode, modelCode, variantCode, makeCode);
 return [brandCode, scaleCode, modelCode, variantCode, makeCode, seq].join('-').toUpperCase();
}

function logMovement(product, action, qtyBefore, qtyChange, note=''){
 const mv={
  id:'MV'+uid(),
  date:today(),
  time:nowTime(),
  productId:product.id,
  productName:product.name,
  sku:product.sku||'',
  action,
  qtyBefore,
  qtyChange,
  qtyAfter:qtyBefore+qtyChange,
  note,
  createdAt:new Date().toISOString()
 };
 DB.movements.unshift(mv);
 saveMovement(mv);
}

// 
// PRICE CHANGE LOGGER
// Handles sell price and/or cost price changes in a single record.
// 
function logPriceChange(product, oldPrice, newPrice, oldCost, newCost, userNote=''){
 // Round to 2dp before comparing to avoid floating-point false positives
 const sellDiff=Math.round((newPrice-oldPrice)*100)/100;
 const costDiff=Math.round((newCost-oldCost)*100)/100;
 const sellChanged=sellDiff!==0;
 const costChanged=costDiff!==0;
 // Only log if sell price or cost price actually changed — nothing else
 if(!sellChanged&&!costChanged) return;

 // Determine action label
 let action;
 if(sellChanged&&costChanged){
  action='Sell & Cost Price Change';
 } else if(sellChanged){
  action=sellDiff>0?'Sell Price Increase':'Sell Price Decrease';
 } else {
  action=costDiff>0?'Cost Price Increase':'Cost Price Decrease';
 }

 // Note describes only price changes — no other product attributes
 const parts=[];
 if(sellChanged) parts.push('Sell price: '+fmt(oldPrice)+' → '+fmt(newPrice)+' ('+(sellDiff>0?'+':'')+fmt(sellDiff)+')');
 if(costChanged) parts.push('Cost price: '+fmt(oldCost)+' → '+fmt(newCost)+' ('+(costDiff>0?'+':'')+fmt(costDiff)+')');
 const autoNote=parts.join(' | ');
 const note=userNote?autoNote+' — '+userNote:autoNote;

 const pc={
  id:'PC'+uid(),
  date:today(),
  time:nowTime(),
  productId:product.id,
  productName:product.name,
  sku:product.sku||'',
  action,
  oldPrice,
  newPrice,
  change:sellDiff,
  oldCost:costChanged?oldCost:'',
  newCost:costChanged?newCost:'',
  costChange:costChanged?costDiff:'',
  note,
  createdAt:new Date().toISOString()
 };
 DB.priceChanges.unshift(pc);
 savePriceChange(pc);
}

window.exportCSV=function(type){
 let rows=[], filename='', headers=[];

 if(type==='sales'){
  filename='Lootly_Sales_'+today()+'.csv';
  headers=['ID','Date','Time','Items','Subtotal','GST','Total','Payment','Cash Tendered','Change'];
  rows=DB.transactions.map(t=>[
   t.id,
   t.date,
   t.time||'',
   (t.items||[]).map(i=>i.name+'x'+i.qty).join(' | '),
   t.subtotal.toFixed(2),
   t.tax.toFixed(2),
   t.total.toFixed(2),
   t.payment,
   t.payment==='Cash'?(t.cashTendered||0).toFixed(2):'',
   t.payment==='Cash'?(t.change||0).toFixed(2):''
  ]);
 } else if(type==='products'){
  filename='Lootly_Products_'+today()+'.csv';
  headers=['ID','SKU','Barcode','Name','Brand','Model','Make','Category','Sell Price (S$)','Cost Price (S$)','Margin %','Stock','Date Added'];
  rows=DB.products.map(p=>[
   p.id,
   p.sku||'',
   p.barcode||'',
   p.name,
   p.brand||'',
   p.make||'',
   p.model||'',
   p.category,
   Number(p.priceSGD||0).toFixed(2),
   Number(p.costSGD||0).toFixed(2),
   p.costSGD?Number(p.costSGD).toFixed(2):'',
   (p.priceSGD||0)>0?(((p.priceSGD||0)-(p.costSGD||0))/(p.priceSGD||0)*100).toFixed(1):'0',
   p.stock,
   toDateStr(p.dateAdded)||toDateStr(p.createdAt)||''
  ]);
 } else if(type==='expenses'){
  filename='Lootly_Expenses_'+today()+'.csv';
  headers=['ID','Date','Category','Description','Amount (S$)','Amount (₱) ref'];
  rows=DB.expenses.map(e=>[
   e.id,
   e.date,
   e.category,
   e.desc,
   e.amountSGD?Number(e.amountSGD).toFixed(2):'0.00',
   e.amount?Number(e.amount).toFixed(2):''
  ]);
 } else if(type==='movements'){
  filename='Lootly_InventoryMovements_'+today()+'.csv';
  headers=['ID','Date','Time','SKU','Product','Action','Qty Before','Qty Change','Qty After','Note'];
  rows=DB.movements.map(m=>[
   m.id,
   m.date,
   m.time||'',
   m.sku||'',
   m.productName,
   m.action,
   m.qtyBefore,
   m.qtyChange,
   m.qtyAfter,
   m.note||''
  ]);
 } else if(type==='pricechanges'){
  filename='Lootly_PriceChanges_'+today()+'.csv';
  headers=['ID','Date','Time','SKU','Product','Action','Old Sell Price','New Sell Price','Sell Change','Old Cost Price','New Cost Price','Cost Change','Note'];
  rows=DB.priceChanges.map(pc=>[
   pc.id,
   pc.date,
   pc.time||'',
   pc.sku||'',
   pc.productName,
   pc.action,
   pc.change!==0&&pc.change!==''?Number(pc.oldPrice).toFixed(2):'',
   pc.change!==0&&pc.change!==''?Number(pc.newPrice).toFixed(2):'',
   pc.change!==0&&pc.change!==''?Number(pc.change).toFixed(2):'',
   pc.costChange!==0&&pc.costChange!==''?Number(pc.oldCost).toFixed(2):'',
   pc.costChange!==0&&pc.costChange!==''?Number(pc.newCost).toFixed(2):'',
   pc.costChange!==0&&pc.costChange!==''?Number(pc.costChange).toFixed(2):'',
   pc.note||''
  ]);
 }

 if(!rows.length){alert('No data to export.');return;}

 // Build CSV — wrap fields containing commas/quotes in double quotes
 function escField(v){
  const s=String(v===null||v===undefined?'':v);
  return s.includes(',')||s.includes('"')||s.includes('\n')
   ? '"'+s.replace(/"/g,'""')+'"'
   : s;
 }
 const csv=[headers, ...rows].map(r=>r.map(escField).join(',')).join('\r\n');
 const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
 const url=URL.createObjectURL(blob);
 const a=document.createElement('a');
 a.href=url;a.download=filename;a.click();
 URL.revokeObjectURL(url);
};
